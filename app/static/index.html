<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de atividades</title>
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Dashboard de atividades por fase</h1>
    <div class="topbar-actions">
      <div id="view-modes" class="segmented" role="group" aria-label="Modo de exibição">
        <button type="button" data-mode="chart" aria-pressed="true">Ver como gráfico</button>
        <button type="button" data-mode="table" aria-pressed="false">Ver como tabela</button>
        <button type="button" data-mode="trend" aria-pressed="false">Ver como tendência</button>
      </div>
      <button type="button" id="theme-toggle" class="icon-btn"></button>
      <button type="button" id="open-settings" class="icon-btn" aria-haspopup="dialog"
              aria-label="Gerenciar repositórios" title="Gerenciar repositórios">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="page">
    <div id="trend-controls" class="trend-controls" hidden>
      <label for="trend-phase">Fase</label>
      <select id="trend-phase">
        <option value="requirements">Requirements</option>
        <option value="fspec">FSpec</option>
        <option value="dspec">DSpec</option>
        <option value="code">Code</option>
        <option value="tests" selected>Tests</option>
      </select>
      <span class="muted">Features por veredito ao longo do tempo, em pontos semanais.</span>
    </div>
    <ul id="legend" class="legend" aria-label="Legenda de vereditos" hidden></ul>
    <div id="charts" class="charts"></div>
    <p id="empty" class="empty" hidden>
      Nenhum repositório cadastrado. Use a engrenagem no canto superior direito para cadastrar.
    </p>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <div class="dialog-head">
      <h2 id="settings-title">Repositórios</h2>
      <button type="button" id="close-settings" class="icon-btn" aria-label="Fechar" title="Fechar">✕</button>
    </div>

    <form id="repo-form" class="repo-form" autocomplete="off">
      <label>
        Repositório
        <input id="repo-name" name="full_name" placeholder="owner/repo ou URL do GitHub" required>
      </label>
      <label>
        Branch <span class="muted">(opcional)</span>
        <input id="repo-branch" name="branch" placeholder="padrão do repositório">
      </label>
      <button type="submit" class="primary">Cadastrar</button>
    </form>

    <div class="toolbar">
      <button type="button" id="collect-all">Coletar todos</button>
    </div>

    <ul id="repo-list" class="repo-list" aria-live="polite"></ul>
    <p id="repo-empty" class="muted" hidden>Nenhum repositório cadastrado.</p>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
